version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
      - "5001:5001"
    env_file:
      - .env.docker
    depends_on:
      - mongo
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  node_modules:
